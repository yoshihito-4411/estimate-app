<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超軽量ブラウザ見積もりツール</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #1e293b; margin: 0; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { font-size: 1.25rem; margin-top: 0; color: var(--primary); }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 4px; }
        input, textarea { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; font-size: 0.875rem; }
        th { background: #f1f5f9; }
        .total-area { text-align: right; font-size: 1.125rem; font-weight: bold; margin-top: 16px; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 16px; }
        .btn:hover { opacity: 0.9; }

        /* 印刷時（PDF保存時）のレイアウト調整 */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>簡易見積もり作成</h1>
    
    <div class="form-group">
        <label>宛先（顧客名）</label>
        <input type="text" id="clientName" placeholder="例: 株式会社〇〇 御中">
    </div>

    <div class="form-group">
        <label>件名</label>
        <input type="text" id="subject" placeholder="例: ホームページ制作費用">
    </div>

    <h3>品目明細</h3>
    <table>
        <thead>
            <tr>
                <th>品目・内容</th>
                <th style="width: 60px;">数量</th>
                <th style="width: 100px;">単価(円)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="text" class="item-name" value="基本デザイン・実装費"></td>
                <td><input type="number" class="item-qty" value="1" oninput="calcTotal()"></td>
                <td><input type="number" class="item-price" value="50000" oninput="calcTotal()"></td>
            </tr>
            <tr>
                <td><input type="text" class="item-name" value="保守サポート（初月）"></td>
                <td><input type="number" class="item-qty" value="1" oninput="calcTotal()"></td>
                <td><input type="number" class="item-price" value="5000" oninput="calcTotal()"></td>
            </tr>
        </tbody>
    </table>

    <div class="total-area">
        合計金額（税込）：<span id="totalAmount">55,000</span> 円
    </div>

    <button class="btn no-print" onclick="saveAndPrint()">PDF保存 / 印刷する</button>
</div>

<script>
    // 金額の自動計算
    function calcTotal() {
        const qtys = document.querySelectorAll('.item-qty');
        const prices = document.querySelectorAll('.item-price');
        let subtotal = 0;

        for (let i = 0; i < qtys.length; i++) {
            const qty = parseFloat(qtys[i].value) || 0;
            const price = parseFloat(prices[i].value) || 0;
            subtotal += qty * price;
        }

        // 10%税込み計算
        const total = Math.floor(subtotal * 1.1);
        document.getElementById('totalAmount').innerText = total.toLocaleString();
        saveData();
    }

    // ブラウザのLocalStorageにデータを自動保存
    function saveData() {
        const data = {
            clientName: document.getElementById('clientName').value,
            subject: document.getElementById('subject').value
        };
        localStorage.setItem('estimate_data', JSON.stringify(data));
    }

    // 読み込み時に復元
    window.onload = function() {
        const saved = localStorage.getItem('estimate_data');
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById('clientName').value = data.clientName || '';
            document.getElementById('subject').value = data.subject || '';
        }
        calcTotal();
    };

    // 印刷ダイアログ（スマホやPCで「PDFとして保存」を選択可能）
    function saveAndPrint() {
        window.print();
    }
</script>

</body>
</html>
